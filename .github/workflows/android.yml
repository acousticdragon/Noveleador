name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: mkdir -p www && cp index.html www/
      - run: npx cap add android
      - run: grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: novela-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
