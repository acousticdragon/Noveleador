function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('novela',1);r.onupgradeneeded=()=>{r.result.createObjectStore('p');r.result.createObjectStore('b')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

function dbDel(st,k){return new Promise((res,rej)=>{const t=DB.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function dbAll(st){return new Promise((res,rej)=>{const out=[],q=DB.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push({k:c.key,v:c.value});c.continue()}else res(out)};q.onerror=()=>rej(q.error)})}
async function putBlob(b,force){if(!force&&USED+b.size>CFG.limitMB*1048576){alert('Llegaste al límite de almacenamiento ('+fmtMB(CFG.limitMB)+'). Podés aumentarlo en Más → Almacenamiento.');return null}
 const id=rid()+rid();try{await dbPut('b',id,b)}catch(e){alert('El teléfono no pudo guardar el archivo: '+((e&&e.message)||e));return null}USED+=b.size;IU[id]=URL.createObjectURL(b);return 'idb:'+id}
const U=u=>u&&String(u).startsWith('idb:')?(IU[u.slice(4)]||''):(u||'');

function dataBlob(u){const i=u.indexOf(','),m=/^data:([^;,]*)/.exec(u.slice(0,i)),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:m?m[1]:''})}
async function inl(o){for(const k of Object.keys(o)){const v=o[k];if(typeof v=='string'&&v.startsWith('data:')&&v.length>200)o[k]=await putBlob(dataBlob(v),1);else if(v&&typeof v=='object')await inl(v)}}
async function load(){const raw=DB?await dbGet('p','nv_'+PJ.cur):null,x=Object.assign(emptyS(),raw||{});x.map=Object.assign({img:'',pins:[]},x.map);

 let freed=0;for(const x of await dbAll('b'))if(!refs.has(x.k)){await dbDel('b',x.k);freed+=x.v.size;USED-=x.v.size;if(IU[x.k]){URL.revokeObjectURL(IU[x.k]);delete IU[x.k]}}return freed}

async function fileAdd(id,f){if(!f)return;const ref=await putBlob(f);if(!ref)return;const e=byId(id);(e.files=e.files||[]).push({u:ref,name:f.name,type:f.type,size:f.size});OPEN=id;save();draw()}

function audit(){const r=[],m={};S.ents.forEach(e=>[e.name,...e.aliases].forEach(n=>{const k=norm(n);if(k)(m[k]=m[k]||new Set()).add(e)}));

function find(n){n=norm(n);if(CH[n])return CH[n].startsWith('new:')?null:byId(CH[n]);let r=S.ents.find(e=>norm(e.name)==n||e.aliases.some(a=>norm(a)==n));if(r)return r;

function guess(name,pre){if(S.tm&&S.tm[norm(name)])return S.tm[norm(name)];if(/\b(don|dona|lord|lady|sir|sor|rey|reina|principe|princesa|capitan|maestro|maestra|senor|senora|doctor|doctora|sargento|general|comandante|duque|duquesa|conde|condesa|baron|barona|emperador|emperatriz|sacerdote|monje|abuelo|abuela|tio|tia)\s+$/.test(pre))return 'personaje';const w=norm(name.split(' ')[0]);

function analyze(t,D){

 sents.forEach(s=>{for(const m of s.matchAll(CAP))if(!isStart(s,m.index))m[0].split(' ').forEach(x=>mids.add(norm(x)))});

 {const mu=[...new Set(nm.filter(x=>x.includes(' ')))];nm.filter(x=>!x.includes(' ')).forEach(x=>{const c=mu.filter(m=>norm(m).split(' ').includes(norm(x)));if(c.length==1&&!S.ents.some(e=>norm(e.name)==norm(x)))ALI[norm(x)]=c[0]})}
