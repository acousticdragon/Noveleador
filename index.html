function ambig(t){const qs=[],seen=new Set(),sents=t.split(/(?<=[.!?…])\s+|\n+/).map(s=>s.trim()).filter(Boolean),mids=new Set(),tk=x=>norm(x).split(' ').filter(w=>w.length>2&&!STOP.has(w));
 sents.forEach(s=>{for(const m of s.matchAll(CAP))if(m.index>0)m[0].split(' ').forEach(x=>mids.add(norm(x)))});
 sents.forEach(s=>{for(const m of s.matchAll(CAP)){let w=m[0].split(/\s+/);while(w.length&&STOP.has(norm(w[0])))w.shift();while(w.length&&STOP.has(norm(w[w.length-1])))w.pop();if(!w.length)continue;

function proc(){const t=$('#idea').value.trim();if(!t)return;const qs=ambig(t);if(qs.length){PQ={t,qs};draw()}else fin(t,{},null)}

  else{h+=`<input type="file" accept="image/*" onchange="pick(this.files[0],'m')">`;if(S.map.img){h+=`<button class="b" onclick="autoPin()">Ubicar lugares automáticamente</button><select onchange="pinE=this.value"><option value="">Elegí un lugar y tocá el mapa…</option>${S.ents.filter(e=>e.type=='lugar').map(e=>`<option value="${e.id}" ${pinE==e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
   <div style="position:relative" onclick="mapClick(event)"><img class="t" src="${S.map.img}" style="width:100%;display:block">${routesOv()}${S.map.pins.filter(p=>byId(p.e)).map(p=>`<span class="pin" style="left:${p.x}%;top:${p.y}%">${esc(byId(p.e).name)}</span>`).join('')}</div>
   ${S.map.pins.map((p,i)=>byId(p.e)?`<button class="s" onclick="S.map.pins.splice(${i},1);save();draw()">✕ ${esc(byId(p.e).name)}</button>`:'').join('')}`}else h+='<div class="mu">Subí un boceto o mapa de tu universo y ubicá los lugares con pines.</div>'}}
 if(tab=='write')h=writeView();
 if(tab=='net')h='<button class="s" onclick="tab=\'world\';draw()">← Mundo</button>'+net();
 if(tab=='time')h=`<select onchange="tf=this.value;draw()"><option value="">Todos los hechos</option>${S.ents.filter(e=>e.type=='personaje').map(e=>`<option value="${e.id}" ${tf==e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`+(S.evs.length?'':'<div class="mu">Sin hechos aún.</div>')+S.evs.map((v,i)=>tf&&!v.who.includes(tf)?'':`<div class="card"><input value="${esc(v.title)}" onchange="S.evs[${i}].title=this.value;save()"><input value="${esc(v.when)}" placeholder="Cuándo (ej: 20 años antes)" onchange="S.evs[${i}].when=this.value;save()">${v.same?'<div class="mu">(mismo momento que otro hecho)</div>':''}<div class="mu">${esc(v.who.map(x=>byId(x)?.name).filter(Boolean).join(', '))}</div><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="s" onclick="S.evs.splice(${i},1);save();draw()">✕</button></div>`).join('');
 if(tab=='guide'){h=`<label class="mu">¿Cómo termina / a dónde querés llegar?</label><textarea rows="2" onchange="S.end=this.value;save();draw()">${esc(S.end)}</textarea><h3>Preguntas y sugerencias</h3>`+guide().map(x=>`<div class="card">${esc(x)}</div>`).join('')+'<h3>Hilos abiertos ('+S.threads.length+')</h3><div class="mu">Misterios, secretos y promesas que mencionaste y que habría que resolver.</div>'+S.threads.map((x,i)=>`<div class="card">${esc(x.t)}<br><button class="s" onclick="S.threads.splice(${i},1);save();draw()">Resuelto</button></div>`).join('')}
 if(tab=='more')h=PJH()+`<button class="b" onclick="dl('novela-respaldo.json',JSON.stringify(S),'application/json')">Exportar respaldo</button><button class="b" onclick="$('#imp').click()">Importar</button><input id="imp" type="file" hidden onchange="imp(this.files[0])"><button class="b" onclick="biblia()">Exportar "biblia" (.md)</button><button class="b" onclick="manu()">Exportar manuscrito</button><p class="mu">Todo se guarda en este dispositivo y funciona sin internet ni IA. Más adelante se le puede sumar una IA opcional.</p>`;
 $('#v').innerHTML=h}
